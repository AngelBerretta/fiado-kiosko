<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión - Fiado</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F4F5F7;
      font-family: system-ui, sans-serif;
      color: #14171F;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #DADCE2;
      border-radius: 14px;
      padding: 32px 24px;
      max-width: 360px;
      text-align: center;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #5B5F6B; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: #1F3A93;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📴 Sin conexión</h1>
    <p>No tenés internet en este momento. Conectate de nuevo para seguir registrando fiados.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
